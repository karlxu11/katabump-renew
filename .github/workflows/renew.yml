name: Katabump Auto Renew

on:
  repository_dispatch:
    types: [cf_timer]
  workflow_dispatch: # 允许手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        set -o pipefail
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py 2>&1 | tee renew.log

    - name: 📅 提取服务器 Expiry 日期
      id: extract_renewal_date
      if: success()
      run: |
        RENEWAL_DATE=$(grep -oP '下次续期时间\(标准\): \K\d{4}-\d{2}-\d{2}' renew.log | tail -1 || true)
        if [ -z "$RENEWAL_DATE" ]; then
          echo "skip_update=true" >> "$GITHUB_OUTPUT"
          echo "::warning::未能提取服务器 Expiry 日期，跳过 Cloudflare Worker Cron 更新"
          exit 0
        fi
        echo "renewal_date=$RENEWAL_DATE" >> "$GITHUB_OUTPUT"
        echo "skip_update=false" >> "$GITHUB_OUTPUT"
        echo "::notice::服务器 Expiry 日期: $RENEWAL_DATE"

    - name: ⏰ 计算 Cloudflare Worker Cron（提前一天）
      id: update_cron
      if: success() && steps.extract_renewal_date.outputs.skip_update != 'true'
      run: |
        set -euo pipefail
        RENEWAL_DATE="${{ steps.extract_renewal_date.outputs.renewal_date }}"
        RENEWAL_EPOCH=$(date -u -d "$RENEWAL_DATE 00:12:00" +%s)
        TARGET_EPOCH=$((RENEWAL_EPOCH - 86400))
        NEXT_UTC=$(date -u -d "@$TARGET_EPOCH" +"%Y-%m-%d %H:%M UTC")
        NEW_CRON="$(date -u -d "@$TARGET_EPOCH" +"%-M %-H %-d %-m *")"
        echo "new_cron=$NEW_CRON" >> "$GITHUB_OUTPUT"
        echo "next_utc=$NEXT_UTC" >> "$GITHUB_OUTPUT"
        echo "::notice::下次 Worker 运行: $NEXT_UTC（北京时间 08:12）"

    - name: ☁️ 更新 Cloudflare Worker Cron
      if: success() && steps.extract_renewal_date.outputs.skip_update != 'true'
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        NEW_CRON: ${{ steps.update_cron.outputs.new_cron }}
      run: |
        set -euo pipefail
        if [ -z "${CF_ACCOUNT_ID:-}" ] || [ -z "${CF_WORKER_NAME:-}" ] || [ -z "${CF_API_TOKEN:-}" ]; then
          echo "::warning::未配置 CF_ACCOUNT_ID / CF_WORKER_NAME / CF_API_TOKEN，跳过 Cloudflare Worker Cron 更新"
          exit 0
        fi
        PAYLOAD=$(python3 -c 'import json, os; print(json.dumps([{"cron": os.environ["NEW_CRON"]}]))')
        BODY_FILE=$(mktemp)
        HTTP_STATUS=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" -X PUT \
          "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}/schedules" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" \
          -H "Content-Type: application/json" \
          --data "$PAYLOAD")
        cat "$BODY_FILE"
        python3 - "$BODY_FILE" "$HTTP_STATUS" <<'PY'
        import json, pathlib, sys
        body = json.loads(pathlib.Path(sys.argv[1]).read_text() or "{}")
        if not (200 <= int(sys.argv[2]) < 300 and body.get("success") is True):
            raise SystemExit(f"Cloudflare Worker Cron 更新失败: {body.get('errors', [])}")
        PY
        echo "::notice::Cloudflare Worker Cron 已更新: ${NEW_CRON}"
        
    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
