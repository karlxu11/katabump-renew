name: Katabump Auto Renew

on:
  repository_dispatch:
    types: [cf_timer]
  workflow_dispatch: # 允许手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: 📥 准备 VPNGate SOCKS 服务
      env:
        VPNGATE_TO_SOCKS_REF: 337dbaffbfdf69df65f0fc8bdcf6517e45ca18db
      run: |
        set -euo pipefail
        git clone --no-checkout --filter=blob:none https://github.com/shenyanshu/vpngate-to-socks.git vpngate-to-socks
        git -C vpngate-to-socks fetch --depth 1 origin "$VPNGATE_TO_SOCKS_REF"
        git -C vpngate-to-socks checkout --detach "$VPNGATE_TO_SOCKS_REF"
        git -C vpngate-to-socks apply "$GITHUB_WORKSPACE/.github/vpngate-selection.patch"

    - name: 🚇 启动 VPNGate SOCKS5 代理
      env:
        VPNGATE_COUNTRY: JP
        VPNGATE_EXCLUDE_KEYWORD: public
      run: |
        set -euo pipefail
        docker compose -p katabump-vpngate \
          -f .github/vpngate-compose.yml \
          up --build -d

    - name: 🔎 等待 VPNGate 节点连接
      env:
        VPNGATE_WAIT_SECONDS: '300'
      run: |
        set -euo pipefail
        python3 scripts/wait_for_vpngate.py
        echo "IS_PROXY=true" >> "$GITHUB_ENV"
        echo "PROXY_SERVER=socks5://127.0.0.1:10080" >> "$GITHUB_ENV"

    - name: 🚀 运行续期脚本
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        set -o pipefail
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py 2>&1 | tee renew.log

    - name: 🧾 输出 VPNGate 服务日志
      if: always()
      run: |
        docker compose -p katabump-vpngate \
          -f .github/vpngate-compose.yml logs --tail=160 || true

    - name: 🛑 停止 VPNGate SOCKS5 代理
      if: always()
      run: |
        docker compose -p katabump-vpngate \
          -f .github/vpngate-compose.yml down --remove-orphans || true

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 10 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
